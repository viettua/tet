<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Săn Lì Xì 2026 (Online)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Nunito:wght@400;700;900&family=Pacifico&display=swap');

        :root {
            --bg-cream: #fff8e1;
            --red-lixi: #d32f2f;
            --yellow-lixi: #fbc02d;
            --green-lixi: #81c784;
            --gold: #ffd700;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            background-color: #3e0a0a;
            background: linear-gradient(135deg, #3e0a0a 0%, #7f0000 100%);
            height: 100vh;
            height: 100dvh; 
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }

        /* --- GLOBAL BACKGROUND --- */
        #bg-video {
            position: fixed;
            top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            width: auto; height: auto;
            transform: translate(-50%, -50%);
            z-index: -2;
            object-fit: cover;
        }

        #bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.35);
            z-index: -1;
            pointer-events: none;
        }

        /* --- Màn hình 1: Nhập tên --- */
        #login-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.3); 
            z-index: 100;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.8s;
            padding: 20px;
            box-sizing: border-box;
        }

        #login-screen.slide-up {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            border: 4px solid var(--gold);
            position: relative;
            backdrop-filter: blur(10px);
            margin-bottom: 60px; /* Điều chỉnh lại khoảng cách đáy */
        }

        .login-card h1 {
            font-family: 'Pacifico', cursive;
            color: var(--red-lixi);
            margin: 0 0 15px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        .login-card input {
            font-family: 'Nunito', sans-serif;
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: 2px solid #ddd;
            border-radius: 15px;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s;
            background: rgba(255,255,255,0.9);
        }
        .login-card input:focus { 
            border-color: var(--red-lixi); 
            background: #fff; 
            box-shadow: 0 0 0 4px rgba(211, 47, 47, 0.1);
        }
        .login-card input.error { border-color: red; background: #fff0f0; }

        #error-msg {
            color: #d32f2f;
            font-size: 0.9rem;
            margin-top: 10px;
            font-weight: bold;
            display: none;
            animation: shake 0.5s;
            background: #ffebee;
            padding: 5px;
            border-radius: 5px;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        .btn-confirm {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(45deg, var(--red-lixi), #b71c1c);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 900;
            margin-top: 25px;
            box-shadow: 0 8px 20px rgba(211, 47, 47, 0.4);
            transition: transform 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
        }
        .btn-confirm:active { transform: scale(0.95); }

        /* --- DÒNG CHỮ CHẠY (MARQUEE) - SỬA LỖI MOBILE --- */
        .marquee-container {
            /* Dùng fixed thay vì absolute để đảm bảo vị trí trên mobile */
            position: fixed; 
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45px; 
            background: rgba(160, 0, 0, 0.95);
            border-top: 2px solid var(--gold);
            overflow: hidden;
            display: flex;
            align-items: center;
            white-space: nowrap;
            color: #fff;
            font-family: 'Nunito', sans-serif;
            font-size: 0.95rem;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
            padding-bottom: env(safe-area-inset-bottom);
            z-index: 101;
            /* Kích hoạt GPU layer để render mượt hơn */
            transform: translateZ(0);
        }

        .marquee-text {
            display: inline-block;
            /* Dùng 100vw để chắc chắn đẩy chữ ra ngoài màn hình */
            padding-left: 100vw;
            /* Tăng thời gian lên 25s cho mượt */
            animation: scroll 25s linear infinite;
            font-weight: bold;
            line-height: 45px; 
            /* Sửa lỗi Safari */
            transform: translate3d(0, 0, 0);
        }

        @keyframes scroll {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* --- Màn hình 2: Game Screen --- */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .header-info {
            position: absolute;
            top: 60px;
            left: 0; right: 0;
            text-align: center;
            z-index: 10;
            pointer-events: none;
            padding: 0 10px;
        }
        .header-pill {
            display: inline-block;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 25px;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            font-weight: bold;
            color: var(--red-lixi);
            border: 2px solid var(--gold);
            font-size: 1.1rem;
            backdrop-filter: blur(5px);
            max-width: 90%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* --- SỬA VỊ TRÍ NÚT NHẠC --- */
        #btn-toggle-sound {
            font-family: 'Nunito', sans-serif;
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 9999;
            background: rgba(0,0,0,0.6);
            color: white;
            border: 1px solid rgba(255,255,255,0.5);
            padding: 8px 15px;
            border-radius: 50px;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }
        #btn-toggle-sound:hover {
            background: var(--red-lixi);
        }

        /* --- STYLE BAO LÌ XÌ --- */
        .lixi-bubble {
            position: absolute;
            width: 110px;
            height: 200px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            will-change: transform;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 25px;
            box-sizing: border-box;
            user-select: none;
            z-index: 5;
            touch-action: manipulation;
            border: 2px solid rgba(255,255,255,0.3);
        }
        
        .lx-en { font-size: 0.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; font-family: 'Nunito', sans-serif; opacity: 0.9; pointer-events: none; }
